<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF5E8">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/v4/icon.svg" type="image/svg+xml">
<title>IELTS 14 · Test 1</title>
<script>try{var s=JSON.parse(localStorage.getItem('dudu-a1-u1')||'{}');if(s.theme)document.documentElement.setAttribute('data-theme',s.theme);}catch(e){}</script>
<link rel="stylesheet" href="../troupe.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
  /* Layout: one reading column under a sticky bar (book · speed · EN·FA · AI key); the five exam parts sit in the bottom tab bar */
  .ie-wrap{max-width:760px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
  .ie-top{gap:8px;flex-wrap:wrap}
  .ie-title{font:800 18px/1.1 var(--t-font-d);margin:0;flex:1;min-width:0;color:var(--t-ink)}
  .ie-title small{display:block;font:600 12.5px/1.3 var(--t-font-b);color:var(--t-ink-2)}
  .ie-seg{display:flex;border:2px solid var(--t-line);border-radius:12px;overflow:hidden;background:var(--t-paper)}
  .ie-seg button{border:0;background:none;padding:7px 9px;font:800 12.5px/1 var(--t-font-d);color:var(--t-ink-2);cursor:pointer;font-variant-numeric:tabular-nums}
  .ie-seg button[aria-pressed="true"]{background:var(--t-teal);color:var(--t-on-accent)}
  .ie-h2{font:800 24px/1.15 var(--t-font-d);margin:0;color:var(--t-ink);text-wrap:balance}
  .ie-h3{font:800 18px/1.2 var(--t-font-d);margin:0 0 8px;color:var(--t-ink)}
  .ie-p{margin:0;font:600 15.5px/1.6 var(--t-font-b);color:var(--t-ink)}
  .ie-instr{margin:0 0 8px;font:italic 600 14.5px/1.5 var(--t-font-b);color:var(--t-ink-2)}
  .fa{display:block;direction:rtl;text-align:right;font:500 15px/1.8 Vazirmatn,Tahoma,sans-serif;color:var(--t-teal-ink);margin-top:2px}
  body.no-fa .fa{display:none}
  .ie-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ie-note{border:2px dashed var(--t-line);border-radius:18px;padding:12px 14px;background:var(--t-paper)}
  .ie-box{border:2px solid var(--t-line);border-radius:14px;padding:10px 12px;background:var(--t-surface);margin:8px 0}
  .ie-box b{font-family:var(--t-font-d)}
  .ie-lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .ie-lines li{font:600 15.5px/2 var(--t-font-b);color:var(--t-ink)}
  .gap{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
  .gap b{font:800 12px/1 var(--t-font-d);background:var(--t-mustard-l);color:var(--t-mustard-ink);border-radius:8px;padding:4px 6px}
  .gap input{width:9.5em;max-width:46vw;font:700 15px/1.2 var(--t-font-b);padding:6px 8px;border:2px solid var(--t-line);border-radius:10px;background:var(--t-surface);color:var(--t-ink)}
  .gap input:focus{outline:none;border-color:var(--t-teal)}
  .ok input,.ok select,.ok .opt{border-color:var(--t-teal)!important;background:var(--t-teal-l)!important}
  .bad input,.bad select{border-color:var(--t-tomato)!important;background:var(--t-tomato-l)!important}
  .key{font:800 13px/1.3 var(--t-font-d);color:var(--t-teal-ink)}
  .bad .key{color:var(--t-tomato-ink)}
  .why{display:block;font:600 13.5px/1.5 var(--t-font-b);color:var(--t-ink-2);margin:2px 0 0 4px}
  .q{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--t-line)}
  .q:first-child{border-top:0}
  .q-t{font:700 15.5px/1.5 var(--t-font-b);color:var(--t-ink)}
  .q-t b{font-family:var(--t-font-d);margin-right:6px}
  .q select{font:700 15px/1 var(--t-font-b);padding:7px 8px;border:2px solid var(--t-line);border-radius:10px;background:var(--t-surface);color:var(--t-ink);max-width:100%}
  .opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--t-line);border-radius:12px;padding:8px 10px;background:var(--t-surface);cursor:pointer;font:600 15px/1.45 var(--t-font-b);color:var(--t-ink)}
  .opt input{margin-top:3px;accent-color:var(--t-teal)}
  .opt.right{border-color:var(--t-teal);background:var(--t-teal-l)}
  .opt.wrong{border-color:var(--t-tomato);background:var(--t-tomato-l)}
  .score{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .band{font:800 44px/1 var(--t-font-d);color:var(--t-tomato-ink);font-variant-numeric:tabular-nums}
  .pass{font:400 17px/1.75 Literata,Georgia,serif;color:var(--t-ink);margin:0}
  .pass-p{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:6px 0}
  .pass-p .let{font:800 16px/1.6 var(--t-font-d);color:var(--t-teal-ink);min-width:1.2em}
  .say{width:34px;height:34px;border-radius:50%;border:2px solid var(--t-line);background:var(--t-paper);cursor:pointer;font-size:15px;flex:none}
  .say.on{background:var(--t-teal);border-color:var(--t-teal);color:var(--t-on-accent)}
  .ie-tabs{display:flex;gap:6px;flex-wrap:wrap}
  .ie-tabs button{border:2px solid var(--t-line);background:var(--t-paper);border-radius:12px;padding:8px 12px;font:800 13.5px/1 var(--t-font-d);color:var(--t-ink-2);cursor:pointer}
  .ie-tabs button[aria-pressed="true"]{border-color:var(--t-tomato);background:var(--t-tomato-l);color:var(--t-tomato-ink)}
  .timer{font:800 18px/1 var(--t-font-d);font-variant-numeric:tabular-nums;color:var(--t-ink)}
  .timer.low{color:var(--t-tomato-ink)}
  textarea.ie-txt{width:100%;min-height:260px;font:500 16px/1.7 var(--t-font-b);padding:12px;border:2px solid var(--t-line);border-radius:14px;background:var(--t-surface);color:var(--t-ink);resize:vertical}
  textarea.ie-txt:focus{outline:none;border-color:var(--t-teal)}
  .wc{font:800 13px/1 var(--t-font-d);color:var(--t-ink-2)}
  .wc.ok{color:var(--t-teal-ink)}
  .model{white-space:pre-line;font:400 16px/1.75 Literata,Georgia,serif;color:var(--t-ink);margin:0}
  .ai-out{white-space:pre-wrap;font:600 15px/1.65 var(--t-font-b);color:var(--t-ink);margin:0}
  .ai-out h4{margin:10px 0 4px;font:800 15px/1.2 var(--t-font-d)}
  .pies{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .pies figure{margin:0;text-align:center}
  .pies figcaption{font:800 14px/1.2 var(--t-font-d);color:var(--t-ink);margin-bottom:4px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;font:700 13px/1 var(--t-font-b);color:var(--t-ink-2)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1.5px solid var(--t-rim)}
  .cue{border:2px solid var(--t-rim);border-radius:18px;padding:14px;background:var(--t-mustard-l)}
  .cue ul{margin:6px 0;padding-left:20px;font:700 15px/1.6 var(--t-font-b)}
  .chat{display:flex;flex-direction:column;gap:10px}
  .msg{max-width:88%;padding:10px 12px;border-radius:16px;font:600 15px/1.55 var(--t-font-b);white-space:pre-wrap}
  .msg.ex{align-self:flex-start;background:var(--t-teal-l);color:var(--t-ink)}
  .msg.me{align-self:flex-end;background:var(--t-mustard-l);color:var(--t-ink)}
  .flash{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
  .flash .w{font:800 34px/1.1 var(--t-font-d);color:var(--t-ink)}
  .flash .ex{font:italic 400 16px/1.6 Literata,Georgia,serif;color:var(--t-ink-2)}
  .warnbox{border:2px solid var(--t-mustard-d);background:var(--t-mustard-l);border-radius:14px;padding:10px 12px;font:600 14px/1.5 var(--t-font-b);color:var(--t-ink)}
  .t-tabbar{max-width:760px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="t-page">
<header class="t-topbar t-topbar--sticky ie-top">
  <a class="t-iconbtn" href="/" aria-label="Choose another book" title="Choose another book"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <h1 class="ie-title">IELTS 14 · Test 1<small>Cambridge Academic · practice</small></h1>
  <div class="ie-seg" id="rateSeg" role="group" aria-label="Reading-aloud speed"></div>
  <div class="ie-seg"><button type="button" id="faBtn" aria-pressed="true" title="Persian help">FA</button></div>
  <button class="t-iconbtn" type="button" id="aiBtn" aria-label="AI settings" title="AI settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9l-4.7 1.8L12 15.5l-1.8-4.7L5.5 9l4.7-1.3z M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z" fill="currentColor"/></svg></button>
</header>
<main class="ie-wrap" id="main"></main>
<nav class="t-tabbar" id="tabbar" aria-label="Test parts"></nav>
<script src="data.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
